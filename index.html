<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#060911">
<title>Casa</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💡</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#0B1324; --bg2:#060911;
    --glass:rgba(24,36,62,.52); --glass-hi:rgba(34,50,84,.62); --edge:rgba(130,180,255,.16);
    --ice:#7CC0FF; --text:#EAF1FB; --muted:#8C9AB5; --warm:#FFC36A; --warm-soft:rgba(255,195,106,.32); --err:#FF9C8C;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  html{background:var(--bg2)}
  body{color:var(--text);font-family:Outfit,system-ui,sans-serif;min-height:100vh}
  body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:
      radial-gradient(1100px 650px at 12% -5%, rgba(70,135,255,.26), transparent 62%),
      radial-gradient(800px 520px at 105% 110%, rgba(255,170,80,.10), transparent 60%),
      linear-gradient(165deg,var(--bg1),var(--bg2))}
  #fondo{position:fixed;inset:0;z-index:-2;background-size:cover;background-position:center;display:none}
  body.con-fondo #fondo{display:block}
  body.con-fondo::before{background:rgba(5,9,18,var(--osc,.45))}
  .prev{width:100%;aspect-ratio:16/9;border-radius:16px;border:1px solid var(--edge);background:#0B1324 center/cover;margin-bottom:12px;display:grid;place-items:center;color:var(--muted);font-size:.92rem}
  .dos{display:flex;gap:10px}
  .dos>*{flex:1}
  .file{position:relative;overflow:hidden;text-align:center}
  .file input{position:absolute;inset:0;opacity:0;cursor:pointer}
  button{font-family:inherit}
  button:focus-visible,input:focus-visible,.tile:focus-visible{outline:2px solid var(--ice);outline-offset:3px}
  .glass{background:var(--glass);border:1px solid var(--edge);border-radius:26px;
         backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}

  /* Barra superior */
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 26px 0;max-width:1320px;margin:auto;flex-wrap:wrap}
  .top-izq{display:flex;align-items:center;gap:12px;min-height:44px}
  #count{color:var(--muted);font-size:.95rem}
  .tabs{display:flex;padding:4px;gap:4px;border-radius:999px;margin-left:auto}
  .tabs button{background:transparent;border:0;color:var(--muted);padding:10px 18px;border-radius:999px;font-size:.95rem;cursor:pointer}
  .tabs button[aria-selected=true]{background:rgba(124,192,255,.16);color:var(--text)}
  .btn-sec{white-space:nowrap;background:transparent;color:var(--text);border:1px solid var(--edge);padding:10px 16px;border-radius:999px;font-size:.92rem;cursor:pointer}
  .btn-listo{white-space:nowrap;background:var(--ice);color:#07101F;border:0;padding:10px 20px;border-radius:999px;font-size:.95rem;font-weight:600;cursor:pointer}
  .ayuda{color:var(--muted);font-size:.92rem}

  /* Tablero tipo pantalla de celular */
  #inicio{max-width:1320px;margin:auto;padding:16px 26px 40px}
  .tablero{display:grid;grid-template-columns:repeat(2,1fr);grid-auto-rows:minmax(150px,auto);gap:14px;grid-auto-flow:row dense}
  @media (min-width:600px){ .tablero{grid-template-columns:repeat(4,1fr)} }
  @media (min-width:1000px){ .tablero{grid-template-columns:repeat(6,1fr);grid-auto-rows:minmax(165px,auto)} }
  .item{position:relative;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  .w-reloj{grid-column:span 2;display:flex;flex-direction:column;justify-content:center;padding:4px 6px;border-radius:26px}
  .w-clima{grid-column:span 2;grid-row:span 2}
  @media (min-width:1000px){ .w-reloj{grid-column:span 3;grid-row:span 2} .w-clima{grid-column:span 3;grid-row:span 2} }
  .hora{font-weight:200;font-size:4.8rem;line-height:.9;letter-spacing:-.04em;font-variant-numeric:tabular-nums;text-shadow:0 0 50px rgba(124,192,255,.35)}
  .fecha{font-size:1.05rem;font-weight:300;color:var(--muted);margin-top:10px}
  .fecha::first-letter{text-transform:uppercase}
  @media (min-width:600px){ .hora{font-size:6rem} }
  @media (min-width:1000px){ .hora{font-size:clamp(7rem,9.5vw,10rem)} .fecha{font-size:1.3rem} }

  .clima{padding:22px 24px;display:flex;flex-direction:column;justify-content:center}
  .c-main{display:flex;align-items:center;gap:18px}
  .c-main svg{width:72px;height:72px;color:var(--ice);flex:none;filter:drop-shadow(0 0 14px rgba(124,192,255,.4))}
  .c-temp{font-size:4rem;font-weight:200;line-height:1}
  .c-desc{font-size:1.1rem;margin-top:4px}
  .c-mm{color:var(--muted);font-size:.95rem;margin-top:2px}
  .c-det{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px;padding-top:16px;border-top:1px solid var(--edge)}
  .c-det b{display:block;font-weight:400;font-size:1.2rem}
  .c-det small{color:var(--muted);font-size:.82rem}
  .c-city{color:var(--muted);font-size:.85rem}
  .c-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
  .seg.chico button{padding:5px 12px;font-size:.82rem}
  .c-horas{display:flex;gap:4px;overflow-x:auto;margin-top:14px;padding-top:12px;border-top:1px solid var(--edge);scrollbar-width:none}
  .c-horas>div{flex:1 0 44px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.8rem;color:var(--muted)}
  .c-horas svg,.c-semana svg{width:24px;height:24px;color:var(--ice)}
  .c-horas b{font-weight:400;color:var(--text);font-size:.95rem}
  .ll{color:#8FD0FF;font-size:.78rem}
  .c-semana{display:flex;flex-direction:column;gap:2px}
  .c-dia{display:grid;grid-template-columns:44px 26px 34px 30px 1fr 30px;align-items:center;gap:8px;padding:5px 0;font-size:.95rem}
  .c-dia .mn{color:var(--muted);text-align:right}
  .c-dia .bar{position:relative;height:5px;border-radius:9px;background:rgba(255,255,255,.08)}
  .c-dia .bar i{position:absolute;top:0;bottom:0;border-radius:9px;background:linear-gradient(90deg,#7CC0FF,#FFC36A)}

  .w-transito{grid-column:span 2;grid-row:span 3;padding:18px;display:flex;flex-direction:column;gap:10px}
  @media (min-width:1000px){ .w-transito{grid-column:span 3;grid-row:span 3} }
  .t-head{display:flex;align-items:center;justify-content:space-between}
  .t-tit{font-size:1.05rem}
  .t-link{color:var(--ice);font-size:.88rem;text-decoration:none}
  .ruta-form{display:flex;gap:8px}
  .ruta-form .inp{padding:11px 14px;font-size:1rem}
  .ruta-form .btn{width:auto;padding:11px 18px}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{border:1px solid var(--edge);background:rgba(8,14,28,.45);color:var(--text);border-radius:999px;padding:6px 12px;font-size:.82rem;cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .t-res{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;min-height:1.6em}
  .t-min{font-size:2.4rem;font-weight:300;line-height:1}
  .t-info{color:var(--muted);font-size:.9rem}
  .t-est{font-size:.88rem}
  .t-mapa{flex:1;min-height:140px;width:100%;border:0;border-radius:16px;background:#0B1324}
  body.editando .w-transito iframe{pointer-events:none}

  .tile{padding:18px 16px 16px;cursor:pointer;display:flex;flex-direction:column;gap:14px;
        transition:background .3s,border-color .3s,box-shadow .3s}
  .bulb{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.06);color:var(--muted);transition:background .35s,box-shadow .35s,color .35s}
  .bulb svg{width:24px;height:24px}
  .tile.on{background:var(--glass-hi);border-color:rgba(255,195,106,.4);box-shadow:0 10px 40px -12px rgba(255,170,80,.35)}
  .tile.on .bulb{background:var(--warm);color:#3A2708;box-shadow:0 0 34px 8px var(--warm-soft)}
  .name{font-size:1.05rem;line-height:1.25}
  .state{color:var(--muted);font-size:.85rem;margin-top:2px}
  .tile.on .state{color:var(--warm)}
  .tile.busy{opacity:.55;pointer-events:none}
  .tile.off-line{opacity:.42;cursor:default}
  input[type=range]{width:100%;accent-color:var(--warm);margin:0}
  .msg{grid-column:1/-1;color:var(--muted);text-align:center;padding:30px 0;align-self:center}

  .w-plano{grid-column:span 2;grid-row:span 5;padding:16px;display:flex;flex-direction:column;gap:10px}
  @media (min-width:600px){ .w-plano{grid-column:span 4;grid-row:span 4} }
  @media (min-width:1000px){ .w-plano{grid-column:span 6;grid-row:span 4} }
  .p-head{display:flex;align-items:center;justify-content:space-between}
  .p-tit{font-size:1.05rem}
  .p-info{color:var(--muted);font-size:.85rem}
  .ambs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;overflow:auto;flex:1;min-height:0;align-content:start;padding-right:2px}
  @media (min-width:1000px){ .ambs{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))} }
  .amb{position:relative;aspect-ratio:4/3;border-radius:20px;overflow:hidden;border:1px solid var(--edge);cursor:pointer;background:#0B1324}
  .amb .foto{position:absolute;inset:0;background-size:cover;background-position:center;
       filter:grayscale(.35) brightness(.72) contrast(1.05) saturate(.7) hue-rotate(185deg);transition:filter .5s}
  .amb .velo{position:absolute;inset:0;transition:background .5s;
       background:linear-gradient(180deg,rgba(10,20,45,.3),rgba(6,12,28,.62)),
       repeating-linear-gradient(0deg,rgba(124,192,255,.06) 0 1px,transparent 1px 4px)}
  .amb .marco{position:absolute;inset:8px;border-radius:14px;border:1px solid rgba(124,192,255,.22);transition:border-color .5s}
  .amb .marco::before,.amb .marco::after{content:'';position:absolute;width:20px;height:20px;border:2px solid var(--ice);opacity:.85;transition:border-color .5s}
  .amb .marco::before{top:-1px;left:-1px;border-right:0;border-bottom:0;border-radius:8px 0 0 0}
  .amb .marco::after{bottom:-1px;right:-1px;border-left:0;border-top:0;border-radius:0 0 8px 0}
  .amb .txt{position:absolute;left:18px;bottom:16px}
  .amb .n{font-size:1rem}
  .amb .e{font-size:.72rem;color:var(--ice);letter-spacing:.14em;text-transform:uppercase;margin-top:2px}
  .amb .pt{position:absolute;right:16px;bottom:16px;width:36px;height:36px;border-radius:50%;border:1px solid rgba(124,192,255,.35);
       display:grid;place-items:center;color:var(--ice);transition:all .5s}
  .amb .pt svg{width:18px;height:18px}
  .amb.on{border-color:rgba(255,195,106,.42);box-shadow:0 14px 45px -18px rgba(255,170,80,.45)}
  .amb.on .foto{filter:brightness(.92) contrast(1.05) saturate(1.15) sepia(.26) hue-rotate(-12deg)}
  .amb.on .velo{background:radial-gradient(60% 55% at 50% 40%,rgba(255,196,103,.3),transparent 70%),
       linear-gradient(180deg,rgba(40,26,8,.18),rgba(20,12,4,.6)),
       repeating-linear-gradient(0deg,rgba(255,196,103,.06) 0 1px,transparent 1px 4px)}
  .amb.on .marco{border-color:rgba(255,196,103,.45)}
  .amb.on .marco::before,.amb.on .marco::after{border-color:var(--warm)}
  .amb.on .e{color:var(--warm)}
  .amb.on .pt{color:#3A2708;background:var(--warm);border-color:transparent;box-shadow:0 0 28px 7px rgba(255,196,103,.35)}
  .amb.sinluz{opacity:.75}
  body.editando .ambs{pointer-events:none}

  /* Pestaña 3D: plano con fotos */
  .p3-wrap{max-width:1280px;margin:0 auto;padding:16px 26px 40px}
  .p3-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
  .p3-head h2{font-size:clamp(26px,3.6vw,40px);font-weight:300;margin:0;letter-spacing:-.02em}
  .p3-head p{margin:0;color:var(--muted)}
  .p3-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:24px;align-items:start}
  @media (max-width:860px){ .p3-grid{grid-template-columns:1fr} }
  .p3-plan{padding:14px}
  .p3-plan svg{display:block;width:100%;height:auto}
  .p3-room{cursor:pointer;outline:none}
  .p3-room image{filter:grayscale(1) contrast(.9) brightness(1.05);opacity:.45;transition:opacity .25s,filter .25s}
  .p3-room:hover image,.p3-room:focus-visible image{opacity:.8;filter:grayscale(.3)}
  .p3-room.on image{opacity:1;filter:none}
  .p3-room .hit{fill:transparent;stroke:rgba(130,180,255,.25);stroke-width:2}
  .p3-room:focus-visible .hit{stroke:var(--ice);stroke-width:6}
  .p3-room .lbl{font-size:17px;font-weight:600;fill:#fff;paint-order:stroke;stroke:rgba(0,0,0,.6);stroke-width:4px;pointer-events:none}
  .p3-view{position:sticky;top:16px}
  .p3-photo{position:relative;border-radius:18px;overflow:hidden;background:#0B1324;aspect-ratio:4/3;border:1px solid var(--edge)}
  .p3-photo img{width:100%;height:100%;object-fit:cover;display:block}
  .p3-nav{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;border:0;background:rgba(10,16,30,.7);color:var(--text);font-size:22px;cursor:pointer;display:grid;place-items:center}
  .p3-prev{left:12px} .p3-next{right:12px}
  .p3-cap{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-top:14px}
  .p3-cap h2{margin:0;font-size:clamp(22px,3vw,32px);font-weight:400}
  .p3-cap span{color:var(--muted)}
  .p3-chips{margin-top:12px}
  .p3-wrap{padding-top:22px}
  .p3-photo img{transition:filter .45s}
  .p3-photo.apagada img{filter:brightness(.5) saturate(.75)}
  .p3-spot{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;padding:6px 8px;border:0;background:none;cursor:pointer;
           font:600 var(--p3tam,14px) Outfit,system-ui,sans-serif;letter-spacing:.14em;color:#CFE6FF;opacity:var(--p3op,.7);
           text-shadow:0 1px 6px rgba(0,0,0,.7);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:color .3s,text-shadow .3s}
  .p3-spot.on{color:#FFD9A0;text-shadow:0 0 14px rgba(255,196,103,.8),0 1px 6px rgba(0,0,0,.6)}
  .p3-spot.busy{pointer-events:none}
  .p3-spot.moviendo{outline:1px dashed rgba(255,255,255,.7);outline-offset:4px;border-radius:8px;cursor:grabbing}
  .p3-spot:focus-visible{outline:2px solid var(--ice);outline-offset:4px;border-radius:8px}
  .p3-chips .chip[aria-pressed="true"]{background:var(--ice);color:#07101F;border-color:transparent}

  /* Horarios */
  .tile{position:relative}
  .t-prog{position:absolute;top:10px;right:10px;width:40px;height:40px;border-radius:12px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer}
  .t-prog svg{width:20px;height:20px}
  .t-prog.act{color:var(--ice)}
  .prog{font-size:.8rem;color:var(--ice);margin-top:4px}
  #modal{position:fixed;inset:0;background:rgba(5,9,18,.72);display:none;align-items:center;justify-content:center;padding:20px;z-index:70}
  #modal.show{display:flex}
  #panel{width:100%;max-width:440px;max-height:90vh;overflow:auto;padding:22px;background:rgba(14,22,40,.94)}
  #panel h2{margin:0 0 4px;font-weight:400;font-size:1.4rem}
  #panel .sub{color:var(--muted);font-size:.9rem;margin:0 0 14px}
  .hrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-top:1px solid var(--edge)}
  .hrow small{display:block;color:var(--muted);font-size:.82rem;margin-top:2px}
  .dos-h{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .dias{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .dia{width:40px;height:40px;border-radius:50%;border:1px solid var(--edge);background:transparent;color:var(--muted);cursor:pointer;font-size:.9rem}
  .dia.act{background:var(--ice);color:#07101F;border-color:transparent}
  input[type=time]{color-scheme:dark}
  .fila-btn{display:flex;gap:10px;margin-top:16px}
  .fila-btn>*{flex:1}

  /* Modo mover */
  body.editando .item{animation:temblar .26s ease-in-out infinite alternate;touch-action:none;cursor:grab}
  body.editando .item:nth-child(2n){animation-delay:-.13s}
  body.editando .item input{pointer-events:none}
  body.editando .w-reloj{outline:1px dashed rgba(130,180,255,.35);outline-offset:-1px}
  @keyframes temblar{from{rotate:-.7deg}to{rotate:.7deg}}
  .item.fantasma{opacity:.18}
  .flotante{position:fixed!important;z-index:60;margin:0;pointer-events:none;animation:none!important;
            transform:scale(1.05);box-shadow:0 30px 60px -18px rgba(0,0,0,.7);cursor:grabbing}

  /* Configuración */
  #config{max-width:640px;margin:auto;padding:18px 26px 40px}
  #config h2{font-weight:400;font-size:1.6rem;margin:6px 0 18px}
  .panel{padding:20px 22px;margin-bottom:16px}
  .panel h3{margin:0 0 4px;font-weight:600;font-size:1.05rem}
  .panel p{margin:0 0 14px;color:var(--muted);font-size:.92rem}
  .fila{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--edge);flex-wrap:wrap}
  .fila:first-of-type{border-top:0}
  .campo{display:flex;flex-direction:column;gap:8px;margin-top:12px}
  .campo label{font-size:.92rem;color:var(--muted)}
  .inp{padding:14px 16px;border-radius:16px;border:1px solid var(--edge);background:rgba(8,14,28,.55);color:var(--text);font:1.05rem Outfit,sans-serif;width:100%}
  .btn{padding:15px;border-radius:16px;border:0;background:var(--ice);color:#07101F;font-size:1.02rem;font-weight:600;cursor:pointer;width:100%}
  .nota{min-height:1.3em;margin-top:12px;font-size:.95rem}
  .nota.err{color:var(--err)} .nota.ok{color:var(--warm)}
  .sw{position:relative;width:50px;height:30px;flex:none}
  .sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
  .sw span{position:absolute;inset:0;border-radius:99px;background:#2A3652;transition:.2s;pointer-events:none}
  .sw span::after{content:'';position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:50%;background:#C9D4E8;transition:.2s}
  .sw input:checked+span{background:var(--ice)}
  .sw input:checked+span::after{transform:translateX(20px);background:#fff}
  .sw input:focus-visible+span{outline:2px solid var(--ice);outline-offset:2px}

  /* Clave de entrada */
  #login{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:24px;
         background:linear-gradient(165deg,var(--bg1),var(--bg2))}
  #login.show{display:flex}
  #login .glass{padding:26px;width:100%;max-width:360px}
  #login h2{margin:0 0 16px;font-weight:300;font-size:1.6rem}

  #inicio.invertido>div:first-child{order:2}
  @media (min-width:900px){ #inicio.invertido{grid-template-columns:1.4fr minmax(330px,.85fr)} }
  #inicio.solo-luces{grid-template-columns:1fr!important}
  #inicio.solo-luces>div:first-child{display:none}
  .seg{display:flex;padding:3px;border-radius:999px;background:rgba(8,14,28,.55);border:1px solid var(--edge)}
  .seg button{border:0;background:transparent;color:var(--muted);padding:8px 14px;border-radius:999px;cursor:pointer;font-size:.92rem}
  .seg button.act{background:rgba(124,192,255,.18);color:var(--text)}
  .ctrl{display:flex;align-items:center;gap:8px;flex:none}
  .mini{width:38px;height:38px;border-radius:12px;border:1px solid var(--edge);background:transparent;color:var(--text);font-size:1.05rem;cursor:pointer}
  .mini:disabled{opacity:.25;cursor:default}
  .mini.file{position:relative;overflow:hidden;display:grid;place-items:center}
  .mini.file input{position:absolute;inset:0;opacity:0;cursor:pointer}
  .amb-min{width:64px;height:48px;border-radius:12px;border:1px solid var(--edge);background:#0B1324 center/cover;flex:none}
  .inp-min{padding:8px 12px;font-size:.92rem;margin-top:6px;width:100%;max-width:200px}
  .amb-edit{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:11px;background:rgba(6,12,28,.6);border:1px solid rgba(124,192,255,.3);color:var(--ice);display:grid;place-items:center;font-size:.95rem;cursor:pointer;overflow:hidden;z-index:2}
  .amb-edit input{position:absolute;inset:0;opacity:0;cursor:pointer}
  body.editando .amb-edit{display:none}
  [hidden]{display:none!important}
  @media (prefers-reduced-motion:reduce){*{transition:none!important} body.editando .item{animation:none}}
</style>
</head>
<body>
<div id="fondo"></div>

<div class="top">

            <clipPath id="p3c-living"><rect x="272" y="163" width="253" height="105"/></clipPath>
            <clipPath id="p3c-cocina"><rect x="0" y="268" width="220" height="254"/></clipPath>
            <clipPath id="p3c-comedor"><rect x="220" y="268" width="305" height="254"/></clipPath>
            <clipPath id="p3c-patio"><rect x="525" y="270" width="268" height="252"/></clipPath>
            <clipPath id="p3c-casa"><rect x="0" y="0" width="793" height="522" rx="28"/></clipPath>
          </defs>
          <g id="p3rooms" clip-path="url(#p3c-casa)"></g>
        </svg>
      </div>
      <div class="p3-view">

          <button class="p3-spot" id="p3spot" aria-label="Prender o apagar la luz">OFF</button>
          <button class="p3-nav p3-prev" onclick="p3show(p3cur-1)" aria-label="Ambiente anterior">‹</button>

  <div class="glass">
    <h2>Casa</h2>
    <div class="campo" style="margin-top:0">
      <label for="k">Clave para entrar</label>

    </div>
    <button class="btn" style="margin-top:14px" onclick="entrar()">Entrar</button>
    <div class="nota err" id="kErr"></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// ▼▼▼ Link de tu Apps Script (el que termina en /exec) ▼▼▼
const API = 'https://script.google.com/macros/s/AKfycbz8QVcWQeW5L7j2mrZbivVQo50ZZBrjFAgwvur8deY8JWVLzWAHnQDlNfMo4BRfaCl0/exec';
// ▲▲▲

async function run(fn, ...args){
  if (!API.startsWith('https://')) throw new Error('Falta pegar el link de Apps Script en index.html');
  let r;
  try { r = await fetch(API, { method: 'POST', body: JSON.stringify({ fn, args }) }); }
  catch(e) { throw new Error('Sin conexión con el motor. Revisá internet o el link de Apps Script.'); }
  const j = await r.json();
  if (!j.ok) throw new Error(j.error);
  return j.result;
}

const LS = {
  get(k, def){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch(e){ return def; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
let devs = null, KEY = '', CFG = '', cfgData = null;
try { KEY = localStorage.getItem('clave_luces') || ''; } catch(e){}
const guardarLocal = k => { try { localStorage.setItem('clave_luces', k); } catch(e){} };
let ORDEN = LS.get('orden_items', []);
let DISENO = Object.assign({ reloj:true, clima:true, transito:true, plano:true }, LS.get('diseno', {}));
let HORARIOS = [], hDev = null, hDias = [0,1,2,3,4,5,6];
let AMBIENTES = {};
const CASA = [
  { id:'living',    n:'Living' },
  { id:'comedor',   n:'Comedor' },
  { id:'cocina',    n:'Cocina' },
  { id:'principal', n:'Dormitorio' },
  { id:'macarena',  n:'Cuarto de Macarena' },
  { id:'banio',     n:'Baño' },
  { id:'patio',     n:'Patio' }
];
let CLIMA = null, climaError = '', VISTA = LS.get('clima_vista', 'hoy');
let DESTINO = LS.get('destino', ''), RECIENTES = LS.get('destinos', []), RUTA = null, rutaMsg = '';

function ordenar(ids){
  const pos = id => { const i = ORDEN.indexOf(id); return i < 0 ? 1e6 : i; };
  return ids.map((id,i) => [id,i]).sort((a,b) => pos(a[0]) - pos(b[0]) || a[1] - b[1]).map(x => x[0]);
}

/* ---------- Íconos ---------- */
const SVG = p => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">' + p + '</svg>';
const NUBE = 'M7 18.5h9.5a4 4 0 0 0 .6-7.95A5.5 5.5 0 0 0 6.5 11.7 3.4 3.4 0 0 0 7 18.5z';
const SOL = '<circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/>';
const LUNA = '<path d="M19.5 14.6A7.8 7.8 0 1 1 9.4 4.5a6.2 6.2 0 0 0 10.1 10.1z"/>';
const ICONOS = {
  sol: d => SVG(d ? SOL : LUNA),
  solnube: d => SVG((d ? '<circle cx="8" cy="8" r="3"/><path d="M8 2.5v1.3M2.5 8h1.3M4.1 4.1l.9.9M11.9 4.1l-.9.9"/>' : '<path d="M11 8.2A4.2 4.2 0 1 1 5.7 3a3.4 3.4 0 0 0 5.3 5.2z"/>') + '<path d="M9 20h8a3.6 3.6 0 0 0 .5-7.15 5 5 0 0 0-9.6 1A3.1 3.1 0 0 0 9 20z"/>'),
  nube: () => SVG('<path d="' + NUBE + '"/>'),
  lluvia: () => SVG('<path d="M7 15.5h9.5a4 4 0 0 0 .6-7.95A5.5 5.5 0 0 0 6.5 8.7 3.4 3.4 0 0 0 7 15.5z"/><path d="M8.5 18l-1 2.5M12.5 18l-1 2.5M16.5 18l-1 2.5"/>'),
  tormenta: () => SVG('<path d="M7 15.5h9.5a4 4 0 0 0 .6-7.95A5.5 5.5 0 0 0 6.5 8.7 3.4 3.4 0 0 0 7 15.5z"/><path d="M12.5 15l-2 3.5h3l-2 3.5"/>'),
  nieve: () => SVG('<path d="M7 15.5h9.5a4 4 0 0 0 .6-7.95A5.5 5.5 0 0 0 6.5 8.7 3.4 3.4 0 0 0 7 15.5z"/><path d="M8.5 19h.01M12 20.5h.01M15.5 19h.01" stroke-width="2.4"/>'),
  niebla: () => SVG('<path d="M4 9h16M3 13h18M5 17h14"/>')
};
const RELOJ = SVG('<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>');
const FOCO = SVG('<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2V16h5v-.1c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/>');

/* ---------- Hora ---------- */
function reloj(){
  const n = new Date(), h = $('hora'), f = $('fecha');
  if (h) h.textContent = n.toLocaleTimeString('es-AR', {hour:'2-digit', minute:'2-digit', hour12:false});
  if (f) f.textContent = n.toLocaleDateString('es-AR', {weekday:'long', day:'numeric', month:'long'});
}

/* ---------- Clima ---------- */
async function cargarClima(){
  try { CLIMA = await run('getClima', KEY); climaError = ''; }
  catch(e) { if (clave(e)) return; climaError = 'No se pudo cargar el clima'; }
  pintarClima();
}
function vistaClima(v){ VISTA = v; LS.set('clima_vista', v); pintarClima(); }
function pintarClima(){
  const w = document.querySelector('#tablero .w-clima');
  if (w) w.innerHTML = climaHTML();
}
function climaHTML(){
  const c = CLIMA;
  if (!c) return '<div class="c-mm">' + (climaError || 'Cargando clima…') + '</div>';
  const ico = (k, d) => (ICONOS[k] || ICONOS.nube)(d);
  const head = '<div class="c-head"><span class="c-city">' + esc(c.ciudad) + '</span>' +
    '<div class="seg chico"><button class="' + (VISTA === 'hoy' ? 'act' : '') + '" onclick="vistaClima(\'hoy\')">Hoy</button>' +
    '<button class="' + (VISTA === 'semana' ? 'act' : '') + '" onclick="vistaClima(\'semana\')">Semana</button></div></div>';
  if (VISTA === 'semana' && c.dias) {
    const lo = Math.min(...c.dias.map(d => d.min)), hi = Math.max(...c.dias.map(d => d.max)), rango = Math.max(1, hi - lo);
    return head + '<div class="c-semana">' + c.dias.map(d =>
      '<div class="c-dia" title="' + esc(d.desc) + '"><span>' + d.nombre + '</span>' + ico(d.icono, true) +
      '<span class="ll">' + (d.lluvia >= 20 ? d.lluvia + '%' : '') + '</span>' +
      '<span class="mn">' + d.min + '°</span>' +
      '<span class="bar"><i style="left:' + ((d.min - lo) / rango * 100) + '%;right:' + ((hi - d.max) / rango * 100) + '%"></i></span>' +
      '<span>' + d.max + '°</span></div>').join('') + '</div>';
  }
  return head +
    '<div class="c-main">' + ico(c.icono, c.dia) + '<div><div class="c-temp">' + c.temp + '°</div></div></div>' +
    '<div class="c-desc">' + esc(c.desc) + '</div>' +
    '<div class="c-mm">Máx ' + c.max + '° / Mín ' + c.min + '° · Sensación ' + c.sens + '°</div>' +
    '<div class="c-mm">Humedad ' + c.hum + '% · Viento ' + c.viento + ' km/h</div>' +
    (c.horas ? '<div class="c-horas">' + c.horas.map(x =>
      '<div><small>' + x.h + '</small>' + ico(x.icono, x.dia) + '<b>' + x.temp + '°</b>' +
      '<span class="ll">' + (x.lluvia >= 20 ? x.lluvia + '%' : '&nbsp;') + '</span></div>').join('') + '</div>' : '');
}

/* ---------- Tránsito ---------- */
let elTransito = null, elPlano = null;
function crearTransito(){
  const el = document.createElement('div');
  el.className = 'item w-transito glass'; el.dataset.id = 'transito';
  el.innerHTML =
    '<div class="t-head"><span class="t-tit">Tránsito</span><a class="t-link" id="tLink" target="_blank" rel="noopener">Abrir en Maps</a></div>' +
    '<div class="ruta-form"><input class="inp" id="destino" placeholder="¿A dónde vas?" autocomplete="off">' +
    '<button class="btn" onclick="buscarRuta()">Ir</button></div>' +
    '<div class="chips" id="chips"></div>' +
    '<div class="t-res" id="tRes"></div>' +
    '<iframe class="t-mapa" id="tMapa" loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="Mapa"></iframe>';
  el.querySelector('#destino').value = DESTINO;
  el.querySelector('#destino').addEventListener('keydown', e => { if (e.key === 'Enter') buscarRuta(); });
  return el;
}
function pintarTransito(){
  if (!elTransito) return;
  const q = s => elTransito.querySelector(s);
  q('#chips').innerHTML = RECIENTES.filter(d => d !== DESTINO).slice(0, 4)
    .map(d => '<button class="chip" onclick="buscarRuta(this.dataset.d)" data-d="' + esc(d) + '">' + esc(d) + '</button>').join('');
  const res = q('#tRes');
  if (rutaMsg) { res.innerHTML = '<span class="t-info"></span>'; res.firstChild.textContent = rutaMsg; }
  else if (!RUTA) res.innerHTML = '<span class="t-info">Escribí un destino para ver cuánto tardás.</span>';
  else {
    const llegada = new Date(Date.now() + RUTA.min * 60000).toLocaleTimeString('es-AR', {hour:'2-digit', minute:'2-digit', hour12:false});
    const extra = RUTA.min - RUTA.normal;
    const est = !RUTA.transito ? ['Sin datos de tránsito', 'var(--muted)']
      : extra >= 10 ? ['Tránsito pesado (+' + extra + ' min)', 'var(--err)']
      : extra >= 4 ? ['Tránsito moderado (+' + extra + ' min)', 'var(--warm)']
      : ['Tránsito fluido', '#8EE3B0'];
    res.innerHTML = '<span class="t-min">' + RUTA.min + ' min</span>' +
      '<span class="t-info">Llegás ' + llegada + ' · ' + esc(RUTA.km) + (RUTA.via ? ' · por ' + esc(RUTA.via) : '') + '</span>' +
      '<span class="t-est" style="color:' + est[1] + '">' + est[0] + '</span>';
  }
  const o = RUTA ? RUTA.origen : '', d = RUTA ? RUTA.destino : '';
  const src = RUTA ? 'https://maps.google.com/maps?saddr=' + encodeURIComponent(o) + '&daddr=' + encodeURIComponent(d) + '&layer=t&output=embed'
                   : 'https://maps.google.com/maps?q=' + encodeURIComponent(CFG_CASA || 'Buenos Aires') + '&layer=t&z=13&output=embed';
  const mapa = q('#tMapa');
  if (mapa.dataset.src !== src) { mapa.dataset.src = src; mapa.src = src; }
  q('#tLink').href = RUTA ? 'https://www.google.com/maps/dir/?api=1&origin=' + encodeURIComponent(o) + '&destination=' + encodeURIComponent(d) + '&travelmode=driving'
                          : 'https://www.google.com/maps';
}
let CFG_CASA = LS.get('casa', '');
async function buscarRuta(dest, silencioso){
  if (dest === undefined) dest = elTransito ? elTransito.querySelector('#destino').value.trim() : DESTINO;
  if (!dest) return;
  DESTINO = dest; LS.set('destino', dest);
  if (elTransito) elTransito.querySelector('#destino').value = dest;
  RECIENTES = [dest, ...RECIENTES.filter(x => x !== dest)].slice(0, 6); LS.set('destinos', RECIENTES);
  if (!silencioso) { rutaMsg = 'Calculando…'; pintarTransito(); }
  try { RUTA = await run('getRuta', KEY, dest); rutaMsg = ''; }
  catch(e) { if (clave(e)) return; RUTA = null; rutaMsg = e.message; }
  pintarTransito();
}

/* ---------- Luces ---------- */
let errorLuces = '';
async function cargarLuces(){
  try { devs = await run('getDevices', KEY); errorLuces = ''; }
  catch(e) { if (clave(e)) return; errorLuces = e.message; }
  render();
}

/* ---------- Tablero ---------- */
let pendiente = false;
function render(){
  if (drag) { pendiente = true; return; }
  const tb = $('tablero');
  const vis = (devs || []).filter(d => !d.hidden);
  const ids = ordenar([...(DISENO.reloj ? ['reloj'] : []), ...(DISENO.clima ? ['clima'] : []),
                       ...(DISENO.plano ? ['plano'] : []), ...vis.map(d => 'l:' + d.id),
                       ...(DISENO.transito ? ['transito'] : [])]);
  if (DISENO.plano && !elPlano) elPlano = crearPlano();
  if (DISENO.transito && !elTransito) { elTransito = crearTransito(); }
  const quedo = elTransito && elTransito.parentNode === tb && DISENO.transito ? elTransito : null;
  [...tb.children].forEach(n => { if (n !== quedo) n.remove(); });
  let antes = !!quedo;
  ids.forEach(id => {
    if (id === 'transito') { if (!quedo) tb.appendChild(elTransito); antes = false; return; }
    const n = id === 'plano' ? elPlano : crearItem(id);
    if (id === 'plano') pintarPlano();
    if (antes) tb.insertBefore(n, quedo); else tb.appendChild(n);
  });
  if (!devs || errorLuces || !vis.length) {
    const m = document.createElement('div'); m.className = 'msg';
    m.textContent = errorLuces ? 'Error: ' + errorLuces : !devs ? 'Buscando tus luces…' : 'No hay luces para mostrar. Activalas desde Configuración.';
    tb.appendChild(m);
  }
  if (DISENO.transito) pintarTransito();
  if (DISENO.plano) pintarPlano();
  if (p3listo) p3estado();
  reloj();
  const on = vis.filter(d => d.on).length;
  $('count').textContent = !devs ? '' : on ? on + ' de ' + vis.length + ' encendida' + (on > 1 ? 's' : '') : 'Todas apagadas';
}

function crearItem(id){
  const el = document.createElement('div');
  el.dataset.id = id;
  if (id === 'reloj') {
    el.className = 'item w-reloj';
    el.innerHTML = '<div class="hora" id="hora">--:--</div><div class="fecha" id="fecha"></div>';
    return el;
  }
  if (id === 'clima') {
    el.className = 'item w-clima clima glass';
    el.innerHTML = climaHTML();
    return el;
  }
  const d = devs.find(x => 'l:' + x.id === id);
  const usable = !d.error && d.online && d.sw;
  el.className = 'item tile glass' + (d.on ? ' on' : '') + (usable ? '' : ' off-line');
  el.tabIndex = usable ? 0 : -1; el.setAttribute('role', 'button');
  const hs = HORARIOS.filter(x => x.dev === d.id && x.activo !== false);
  const prog = hs.length ? '<div class="prog">⏰ ' + (hs[0].on || '—') + ' → ' + (hs[0].off || '—') + (hs.length > 1 ? ' (+' + (hs.length - 1) + ')' : '') + '</div>' : '';
  el.innerHTML = '<div class="bulb">' + FOCO + '</div><div><div class="name">' + esc(d.name) + '</div><div class="state">' +
    (d.error ? 'Error: ' + esc(d.error) : !d.online ? 'Sin conexión' : d.on ? (d.br ? 'Encendida · ' + d.pct + '%' : 'Encendida') : 'Apagada') + '</div>' + prog + '</div>';
  if (d.sw) {
    const b = document.createElement('button');
    b.className = 't-prog' + (hs.length ? ' act' : ''); b.innerHTML = RELOJ;
    b.setAttribute('aria-label', 'Programar horario de ' + d.name);
    b.onclick = e => { e.stopPropagation(); if (!EDIT) abrirHorarios(d.id); };
    el.appendChild(b);
  }
  if (usable) {
    el.onclick = e => { if (!EDIT && e.target.tagName !== 'INPUT' && !e.target.closest('.t-prog')) toggle(d, el); };
    el.onkeydown = e => { if (!EDIT && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); toggle(d, el); } };
    if (d.br && d.on) {
      const r = document.createElement('input');
      r.type = 'range'; r.min = 1; r.max = 100; r.value = d.pct; r.setAttribute('aria-label', 'Brillo de ' + d.name);
      r.onchange = () => brillo(d, el, +r.value);
      el.appendChild(r);
    }
  }
  return el;
}

async function toggle(d, t){
  t.classList.add('busy');
  try { await run('setPower', KEY, d.id, d.sw, !d.on); d.on = !d.on; render(); }
  catch(e) { t.classList.remove('busy'); if (!clave(e)) alert('No se pudo cambiar: ' + e.message); }
}

async function brillo(d, t, pct){
  t.classList.add('busy');
  try { await run('setBright', KEY, d.id, d.br, pct); d.pct = pct; render(); }
  catch(e) { t.classList.remove('busy'); if (!clave(e)) alert('No se pudo cambiar el brillo: ' + e.message); }
}

async function apagarTodo(){
  const enc = (devs || []).filter(d => !d.hidden && d.on && d.sw);
  if (!enc.length) return;
  document.querySelectorAll('.tile').forEach(t => t.classList.add('busy'));
  try { await run('allOff', KEY, enc.map(d => ({id:d.id, sw:d.sw}))); } catch(e) { clave(e); }
  cargarLuces();
}

/* ---------- Ambientes con foto ---------- */
function ambsHTML(){
  return '<div class="ambs">' + CASA.map(r => {
    const l = (devs || []).find(d => AMBIENTES[d.id] === r.id);
    const on = l && l.on;
    const estado = !l ? 'Sin luz asignada' : !l.online ? 'Sin conexión' : on ? 'Encendida' : 'Apagada';
    return '<div class="amb' + (on ? ' on' : '') + (l ? '' : ' sinluz') + '" data-amb="' + r.id + '" role="button" tabindex="0">' +
      '<div class="foto" style="background-image:url(\'' + 'fotos/' + r.id + '.jpg' + '\')"></div>' +
      '<div class="velo"></div><div class="marco"></div>' +
      '<div class="txt"><div class="n">' + esc(r.n) + '</div><div class="e">' + estado + '</div></div>' +
      '<div class="pt">' + FOCO + '</div></div>';
  }).join('') + '</div>';
}
function crearPlano(){
  const el = document.createElement('div');
  el.className = 'item w-plano glass'; el.dataset.id = 'plano';
  el.innerHTML = '<div class="p-head"><span class="p-tit">Mi casa</span><span class="p-info" id="pInfo"></span></div>' + ambsHTML();
  el.onclick = e => {
    if (EDIT) return;

/* ---------- Pestaña 3D: plano con fotos ---------- */
const P3 = [
  { id:'living',     n:'Living',               f:'living',    x:272, y:163, w:253, h:105 },
  { id:'comedor',    n:'Comedor',              f:'comedor',   x:220, y:268, w:305, h:254 },
  { id:'cocina',     n:'Cocina',               f:'cocina',    x:0,   y:268, w:220, h:254 },
  { id:'dormitorio', n:'Dormitorio',           f:'principal', x:0,   y:0,   w:272, h:268 },
  { id:'macarena',   n:'Dormitorio Macarena',  f:'macarena',  x:525, y:0,   w:268, h:270 },
  { id:'banio',      n:'Baño',                 f:'banio',     x:272, y:0,   w:253, h:163 },
  { id:'patio',      n:'Patio',                f:'patio',     x:525, y:270, w:268, h:252 }
];
let p3cur = 0, p3listo = false;
// Posición inicial de la lámpara en cada foto (% del ancho y alto de la imagen)
const LAMPARA = { living:[53,15], comedor:[41,32], cocina:[59,43], principal:[68,22], macarena:[44,22], banio:[49,6], patio:[49,29] };
const p3cfg = () => { if (!AMBIENTES._p3 || typeof AMBIENTES._p3 !== 'object') AMBIENTES._p3 = { pos:{}, tam:14, op:70 }; if (!AMBIENTES._p3.pos) AMBIENTES._p3.pos = {}; return AMBIENTES._p3; };
function p3luz(){ const r = P3[p3cur]; return (devs || []).find(x => AMBIENTES[x.id] === r.f); }
function p3aplicarEstilo(){
  const c = AMBIENTES._p3 || {};
  document.body.style.setProperty('--p3tam', (c.tam || 14) + 'px');
  document.body.style.setProperty('--p3op', ((c.op == null ? 70 : c.op) / 100).toFixed(2));
}
let p3guardarT = null;
function p3guardar(){ clearTimeout(p3guardarT); p3guardarT = setTimeout(() => { run('guardarAmbientes', KEY, AMBIENTES).catch(() => {}); }, 600); }
function p3caja(){
  const img = $('p3big'), bw = img.clientWidth, bh = img.clientHeight, nw = img.naturalWidth, nh = img.naturalHeight;
  if (!nw) return null;
  const s = Math.max(bw / nw, bh / nh), dw = nw * s, dh = nh * s;
  return { ox: (bw - dw) / 2, oy: (bh - dh) / 2, dw, dh, bw, bh };
}
function p3ubicar(){
  const k = p3caja(), f = P3[p3cur].f; if (!k) return;
  const pos = (AMBIENTES._p3 && AMBIENTES._p3.pos && AMBIENTES._p3.pos[f]) || LAMPARA[f] || [50, 50];
  $('p3spot').style.left = (k.ox + k.dw * pos[0] / 100) + 'px';
  $('p3spot').style.top = (k.oy + k.dh * pos[1] / 100) + 'px';
}
function p3estado(){
  if (!p3listo) return;
  p3aplicarEstilo();
  const d = p3luz(), spot = $('p3spot'), on = !!(d && d.on);
  spot.classList.toggle('on', on);
  $('p3photo').classList.toggle('apagada', !!d && !on);

}
async function p3alternar(){
  const d = p3luz(), spot = $('p3spot');
  if (!d || !d.online || !d.sw) return;
  spot.classList.add('busy');
  try { await run('setPower', KEY, d.id, d.sw, !d.on); d.on = !d.on; render(); }
  catch(err) { clave(err); }

// Tocar = prender/apagar. Mantener apretado = mover.
const p3p = { t:null, mov:false, x:0, y:0, arr:false };
function p3eventos(){
  const spot = $('p3spot'), foto = $('p3photo');
  spot.addEventListener('pointerdown', e => {
    e.preventDefault(); spot.setPointerCapture(e.pointerId);
    Object.assign(p3p, { x:e.clientX, y:e.clientY, mov:false, arr:false });
    clearTimeout(p3p.t);
    p3p.t = setTimeout(() => { p3p.arr = true; spot.classList.add('moviendo'); try { navigator.vibrate && navigator.vibrate(25); } catch(_){} }, 500);
  });
  spot.addEventListener('pointermove', e => {
    if (!p3p.arr) { if (Math.hypot(e.clientX - p3p.x, e.clientY - p3p.y) > 8) { p3p.mov = true; clearTimeout(p3p.t); } return; }
    const r = foto.getBoundingClientRect();
    const x = Math.max(0, Math.min(r.width, e.clientX - r.left)), y = Math.max(0, Math.min(r.height, e.clientY - r.top));
    spot.style.left = x + 'px'; spot.style.top = y + 'px';
  });
  const soltar = e => {
    clearTimeout(p3p.t);
    if (p3p.arr) {
      p3p.arr = false; spot.classList.remove('moviendo');
      const k = p3caja(); if (!k) return;
      const x = parseFloat(spot.style.left), y = parseFloat(spot.style.top);
      p3cfg().pos[P3[p3cur].f] = [Math.round((x - k.ox) / k.dw * 1000) / 10, Math.round((y - k.oy) / k.dh * 1000) / 10];
      p3guardar();
    } else if (e.type === 'pointerup' && !p3p.mov) {
      p3alternar();
    }
  };
  spot.addEventListener('pointerup', soltar);
  spot.addEventListener('pointercancel', soltar);
  spot.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); p3alternar(); } });
  spot.addEventListener('contextmenu', e => e.preventDefault());
}
function iniciar3D(){
  if (p3listo) return; p3listo = true;
  const NS = 'http://www.w3.org/2000/svg', g = $('p3rooms'), chips = $('p3chips');
  P3.forEach((r, i) => {
    const el = document.createElementNS(NS, 'g');
    el.setAttribute('class', 'p3-room'); el.setAttribute('tabindex', '0'); el.setAttribute('role', 'button'); el.setAttribute('aria-label', r.n);
    const im = document.createElementNS(NS, 'image');
    im.setAttribute('href', 'fotos/' + r.f + '.jpg');
    ['x','y'].forEach(k => im.setAttribute(k, r[k])); im.setAttribute('width', r.w); im.setAttribute('height', r.h);
    im.setAttribute('preserveAspectRatio', 'xMidYMid slice'); im.setAttribute('clip-path', 'url(#p3c-' + r.id + ')');
    const hit = document.createElementNS(NS, 'rect');
    hit.setAttribute('class', 'hit'); ['x','y'].forEach(k => hit.setAttribute(k, r[k])); hit.setAttribute('width', r.w); hit.setAttribute('height', r.h);
    el.append(im, hit);
    el.addEventListener('click', () => p3show(i));
    el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); p3show(i); } });
    g.append(el); r.el = el;
    const b = document.createElement('button'); b.className = 'chip'; b.textContent = r.n;
    b.addEventListener('click', () => p3show(i)); chips.append(b); r.chip = b;
  });
  document.addEventListener('keydown', e => {
    if ($('tres').hidden) return;
    if (e.key === 'ArrowLeft') p3show(p3cur - 1);
    if (e.key === 'ArrowRight') p3show(p3cur + 1);
  });
  p3eventos();
  $('p3big').addEventListener('load', p3ubicar);
  window.addEventListener('resize', p3ubicar);
  p3show(0);
}
function p3show(i){
  p3cur = (i + P3.length) % P3.length; const r = P3[p3cur];
  $('p3big').src = 'fotos/' + r.f + '.jpg'; $('p3big').alt = r.n;
  $('p3name').textContent = r.n; $('p3count').textContent = (p3cur + 1) + ' de ' + P3.length;
  P3.forEach((x, j) => { x.el.classList.toggle('on', j === p3cur); x.chip.setAttribute('aria-pressed', j === p3cur); });
  p3ubicar(); p3estado();
}

/* ---------- Mover como en el celular ---------- */
let EDIT = false, drag = null, ultimoCambio = 0;
const presion = { t:null, el:null, x:0, y:0, lx:0, ly:0 };

function entrarEdicion(){
  EDIT = true; document.body.classList.add('editando');
  $('barraNormal').hidden = true; $('barraEdicion').hidden = false;
}
function salirEdicion(){
  EDIT = false; document.body.classList.remove('editando');
  $('barraNormal').hidden = false; $('barraEdicion').hidden = true;
  if (pendiente) { pendiente = false; render(); }
}

function empezarArrastre(el, x, y){
  const r = el.getBoundingClientRect();
  const f = el.cloneNode(true);
  f.classList.add('flotante'); f.removeAttribute('id');
  f.querySelectorAll('[id]').forEach(n => n.removeAttribute('id'));
  f.querySelectorAll('iframe').forEach(n => n.remove());
  Object.assign(f.style, { width: r.width + 'px', height: r.height + 'px', left: r.left + 'px', top: r.top + 'px' });
  document.body.appendChild(f);
  el.classList.add('fantasma');
  drag = { el, f, dx: x - r.left, dy: y - r.top };
  try { navigator.vibrate && navigator.vibrate(25); } catch(e){}
}

function moverArrastre(x, y){
  drag.f.style.left = (x - drag.dx) + 'px';
  drag.f.style.top = (y - drag.dy) + 'px';
  if (y > innerHeight - 70) scrollBy(0, 14); else if (y < 70) scrollBy(0, -14);
  if (Date.now() - ultimoCambio < 150) return;
  const t = document.elementFromPoint(x, y)?.closest('#tablero > .item');
  if (!t || t === drag.el) return;
  const hijos = [...$('tablero').children];
  const a = hijos.indexOf(drag.el), b = hijos.indexOf(t);
  ultimoCambio = Date.now();
  flip(() => { if (a < b) t.after(drag.el); else t.before(drag.el); });
}

function soltar(){
  const { el, f } = drag; drag = null;
  const r = el.getBoundingClientRect();
  f.style.transition = 'left .18s ease, top .18s ease, transform .18s ease';
  f.style.left = r.left + 'px'; f.style.top = r.top + 'px'; f.style.transform = 'scale(1)';
  setTimeout(() => { f.remove(); el.classList.remove('fantasma'); }, 190);
  const nuevos = [...$('tablero').children].map(n => n.dataset.id).filter(Boolean);
  ORDEN = [...nuevos, ...ORDEN.filter(id => !nuevos.includes(id))];
  LS.set('orden_items', ORDEN);
  if (pendiente && !EDIT) { pendiente = false; render(); }
}

function flip(cambio){
  const hijos = [...$('tablero').children];
  const antes = new Map(hijos.map(n => [n, n.getBoundingClientRect()]));
  cambio();
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  hijos.forEach(n => {
    const a = antes.get(n), b = n.getBoundingClientRect();
    const dx = a.left - b.left, dy = a.top - b.top;
    if (!dx && !dy) return;
    n.style.transition = 'none';
    n.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
    requestAnimationFrame(() => requestAnimationFrame(() => {
      n.style.transition = 'transform .22s ease'; n.style.transform = '';
      setTimeout(() => { n.style.transition = ''; }, 240);
    }));
  });
}

function cancelarPresion(){ clearTimeout(presion.t); presion.t = null; presion.el = null; }

$('tablero').addEventListener('pointerdown', e => {
  const el = e.target.closest('#tablero > .item');
  if (!el || (e.button && e.button !== 0)) return;
  if (EDIT) { e.preventDefault(); empezarArrastre(el, e.clientX, e.clientY); return; }
  if (e.target.tagName === 'INPUT') return;
  cancelarPresion();
  Object.assign(presion, { el, x: e.clientX, y: e.clientY, lx: e.clientX, ly: e.clientY });
  presion.t = setTimeout(() => {
    const p = presion.el; cancelarPresion();
    if (!p) return;
    entrarEdicion(); empezarArrastre(p, presion.lx, presion.ly);
  }, 500);
});
document.addEventListener('pointermove', e => {
  if (presion.t) {
    presion.lx = e.clientX; presion.ly = e.clientY;
    if (Math.hypot(e.clientX - presion.x, e.clientY - presion.y) > 10) cancelarPresion();
  }
  if (drag) moverArrastre(e.clientX, e.clientY);
});
const fin = () => { cancelarPresion(); if (drag) soltar(); };
document.addEventListener('pointerup', fin);
document.addEventListener('pointercancel', fin);
document.addEventListener('touchmove', e => { if (drag) e.preventDefault(); }, { passive: false });
$('tablero').addEventListener('contextmenu', e => e.preventDefault());

      '<div class="campo"><label for="nueva">Clave de entrada</label>' +
      '<input class="inp" id="nueva" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false"></div>' +
    '</div>' +
    '<div class="panel glass"><h3>Fondo de pantalla</h3><p>Se guarda en este equipo. Cargala una vez en cada pantalla donde la quieras.</p>' +
      '<div class="prev" id="prev">Sin fondo</div>' +
      '<div class="dos"><label class="btn file">Elegir imagen<input type="file" accept="image/*" onchange="subirFondo(this)"></label>' +
      '<button class="btn-sec" onclick="sacarFondo()">Quitar fondo</button></div>' +
      '<div class="campo"><label for="osc">Oscurecer fondo: <span id="oscV">' + c.osc + '%</span></label>' +
      '<input type="range" id="osc" min="0" max="85" value="' + c.osc + '"></div>' +
      '<div class="nota" id="fMsg"></div>' +
    '</div>' +
    '<div class="panel glass"><h3>Tránsito</h3><p>Desde dónde se calculan los viajes.</p>' +
      '<div class="campo" style="margin-top:0"><label for="casa">Dirección de tu casa</label><input class="inp" id="casa" type="text" autocomplete="off" placeholder="Calle 123, Localidad"></div>' +
    '</div>' +
    '<div class="panel glass"><h3>Clima</h3>' +
      '<div class="campo" style="margin-top:0"><label for="ciudad">Ciudad</label><input class="inp" id="ciudad" type="text" autocomplete="off"></div>' +
    '</div>' +
    '<button class="btn" onclick="guardarCfg()">Guardar cambios</button>' +
    '<div class="nota" id="cfgMsg"></div>';
  $('nueva').value = c.clave; $('ciudad').value = c.ciudad; $('casa').value = c.casa || '';
  try { const d = localStorage.getItem('fondo_data'); if (d) { $('prev').style.backgroundImage = 'url("' + d + '")'; $('prev').textContent = ''; } } catch(e){}
  $('osc').oninput = () => { $('oscV').textContent = $('osc').value + '%'; aplicarFondo(undefined, +$('osc').value); };
  $('dReloj').onchange = () => { DISENO.reloj = $('dReloj').checked; LS.set('diseno', DISENO); };
  $('dClima').onchange = () => { DISENO.clima = $('dClima').checked; LS.set('diseno', DISENO); };
  $('dTransito').onchange = () => { DISENO.transito = $('dTransito').checked; LS.set('diseno', DISENO); };
  { const c = p3cfg();
    $('p3tam').value = c.tam || 14; $('p3op').value = c.op == null ? 70 : c.op;
    const pinta = () => { $('p3tamV').textContent = $('p3tam').value + ' px'; $('p3opV').textContent = $('p3op').value + '%'; };
    pinta();
    $('p3tam').oninput = () => { c.tam = +$('p3tam').value; pinta(); p3aplicarEstilo(); p3guardar(); };
    $('p3op').oninput = () => { c.op = +$('p3op').value; pinta(); p3aplicarEstilo(); p3guardar(); };
  }
  $('dPlano').onchange = () => { DISENO.plano = $('dPlano').checked; LS.set('diseno', DISENO); };
  CASA.forEach(r => { const s = $('amb_' + r.id); if (s) s.onchange = async () => {
    Object.keys(AMBIENTES).forEach(k => { if (AMBIENTES[k] === r.id) delete AMBIENTES[k]; });
    if (s.value) AMBIENTES[s.value] = r.id;
    const m = $('ambMsg'); m.className = 'nota'; m.textContent = 'Guardando…';
    try { await run('guardarAmbientes', KEY, AMBIENTES); m.className = 'nota ok'; m.textContent = 'Guardado.'; pintarPlano(); }
    catch(e) { m.className = 'nota err'; m.textContent = e.message; }
  }; });
}

function p3resetPos(){ p3cfg().pos = {}; p3guardar(); if (p3listo) p3ubicar(); $('cfgMsg').className = 'nota ok'; $('cfgMsg').textContent = 'Posiciones restablecidas.'; }

function resetOrden(){ ORDEN = []; LS.set('orden_items', ORDEN); $('cfgMsg').className = 'nota ok'; $('cfgMsg').textContent = 'Orden restablecido.'; }

async function guardarCfg(){
  const c = cfgData, on = $('on').checked, clave = $('nueva').value.trim();
  const ocultas = c.devices.filter(d => !$('v_' + d.id).checked).map(d => d.id);
  const m = $('cfgMsg'); m.className = 'nota'; m.textContent = 'Guardando…';
  try {
    const r = await run('guardarConfig', CFG, {on, clave, ciudad: $('ciudad').value, casa: $('casa').value, ocultas, osc: +$('osc').value});
    CFG_CASA = $('casa').value.trim(); LS.set('casa', CFG_CASA); RUTA = null;
    try { localStorage.setItem('fondo_osc', $('osc').value); } catch(e){}
    c.osc = +$('osc').value;
    if (on) { KEY = clave; guardarLocal(clave); }
    c.devices.forEach(d => d.hidden = ocultas.includes(d.id));
    c.on = on; c.clave = clave; c.ciudad = r.ciudad; $('ciudad').value = r.ciudad;
    m.className = 'nota ok'; m.textContent = 'Cambios guardados.';
    iniciar();
  } catch(e) { m.className = 'nota err'; m.textContent = e.message; }
}

/* ---------- Fondo de pantalla ---------- */
function aplicarFondo(data, osc){
  if (osc != null) document.body.style.setProperty('--osc', (osc/100).toFixed(2));
  if (data === undefined) return;
  if (data) { $('fondo').style.backgroundImage = 'url("' + data + '")'; document.body.classList.add('con-fondo'); }
  else { $('fondo').style.backgroundImage = ''; document.body.classList.remove('con-fondo'); }
}
function fondoLocal(){
  try { const d = localStorage.getItem('fondo_data'), o = localStorage.getItem('fondo_osc');
        if (d) aplicarFondo(d, o != null ? +o : 45); } catch(e){}
}
function cargarFondo(){ fondoLocal(); }
function achicar(file, max = 1920, q = 0.82){
  return new Promise((ok, ko) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement('canvas');
      cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url); ok(cv.toDataURL('image/jpeg', q));
    };
    img.onerror = () => ko(new Error('No se pudo leer la imagen'));
    img.src = url;
  });
}
async function subirFondo(input){
  const f = input.files[0]; if (!f) return;
  const m = $('fMsg'); m.className = 'nota'; m.textContent = 'Cargando imagen…';
  try {
    let data = await achicar(f, 1920, 0.82);
    try { localStorage.setItem('fondo_data', data); }
    catch(e) { data = await achicar(f, 1280, 0.7); localStorage.setItem('fondo_data', data); }
    aplicarFondo(data, +$('osc').value);
    $('prev').style.backgroundImage = 'url("' + data + '")'; $('prev').textContent = '';
    m.className = 'nota ok'; m.textContent = 'Fondo cargado en este equipo.';
  } catch(e) { m.className = 'nota err'; m.textContent = 'No se pudo cargar: ' + e.message; }
  input.value = '';
}
function sacarFondo(){
  try { localStorage.removeItem('fondo_data'); } catch(e){}
  aplicarFondo(null);
  $('prev').style.backgroundImage = ''; $('prev').textContent = 'Sin fondo';
  $('fMsg').className = 'nota ok'; $('fMsg').textContent = 'Fondo quitado.';
}

/* ---------- Pantalla siempre encendida ---------- */
let lock = null;
async function mantenerEncendida(){
  try { if ('wakeLock' in navigator && !lock && !document.hidden) {
    lock = await navigator.wakeLock.request('screen');
    lock.addEventListener('release', () => lock = null);
  } } catch(e){}
}
document.addEventListener('click', mantenerEncendida);
document.addEventListener('visibilitychange', mantenerEncendida);
mantenerEncendida();

/* ---------- Arranque y actualización ---------- */
function iniciar(){ cargarLuces(); cargarClima(); cargarFondo(); cargarHorarios(); cargarAmbientes(); if (DESTINO && DISENO.transito) buscarRuta(DESTINO, true); }
fondoLocal();
render();
setInterval(reloj, 1000);
iniciar();
setInterval(() => { if (!document.hidden && !$('inicio').hidden && !EDIT) cargarLuces(); }, 5 * 60 * 1000);
setInterval(() => { if (!document.hidden) cargarClima(); }, 15 * 60 * 1000);
setInterval(() => { if (!document.hidden && DESTINO && DISENO.transito && !EDIT) buscarRuta(DESTINO, true); }, 5 * 60 * 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && !EDIT) iniciar(); });
</script>
